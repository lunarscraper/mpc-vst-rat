name: VST release (draft)

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version, e.g. 0.1.0
        required: true
        default: 0.1.0
      dry_run:
        description: Build only (zip + skin previews as run artifacts), no draft release
        type: boolean
        default: true

jobs:
  rat:
    uses: sd88me/mpc-vst-plugins/.github/workflows/vst-release.yml@259f75d0ce0f836cfd89cc0a33c550b55917cffc
    permissions:
      contents: write
    with:
      tag: rat-vst-v${{ inputs.version }}
      version: ${{ inputs.version }}
      tools_ref: 259f75d0ce0f836cfd89cc0a33c550b55917cffc
      vst_dir: vst
      build: bash vst/build.sh
      host_test: bash vst/test.sh
      plugin_id: rat
      license: MIT
      about: RAT distortion pedal (insert effect) modelled from its circuit - silicon, LED, germanium, op-amp clipping, Ruetz mod.
      dry_run: ${{ inputs.dry_run }}
